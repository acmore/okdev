name: Verify E2E

# Proves that E2E Kind already passed for a specific commit, so the release
# path does not have to re-run it.
#
# Tagging a commit that is already on main means the identical tree has just
# been validated there — v0.11.0's tag run and its main run were both
# bafdd68. Re-running it cost ~20 minutes and produced no new signal, and
# because the suite can flake it was a second chance to block a good release
# rather than added confidence.
#
# A tag pointing at a commit that never ran E2E is the case this must catch:
# it fails loudly instead of publishing from an unvalidated tree.

on:
  workflow_call:
    inputs:
      sha:
        description: Commit that must have a successful E2E Kind run
        required: true
        type: string
      timeout_minutes:
        description: How long to wait for an in-flight run on that commit
        required: false
        default: 45
        type: number

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Require a successful E2E Kind run for ${{ inputs.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
          DEADLINE_MINUTES: ${{ inputs.timeout_minutes }}
        run: |
          set -euo pipefail
          runs_url="repos/${GITHUB_REPOSITORY}/actions/workflows/e2e-kind.yml/runs"
          deadline=$(( SECONDS + DEADLINE_MINUTES * 60 ))

          count_runs() {
            gh api "${runs_url}?head_sha=${SHA}&status=$1&per_page=1" --jq '.total_count'
          }

          while :; do
            # A commit can have several runs (a re-run after a flake). Any
            # success is proof the tree passed, whichever attempt produced it.
            if [ "$(count_runs success)" -gt 0 ]; then
              echo "E2E Kind passed for ${SHA}"
              exit 0
            fi

            pending=$(( $(count_runs in_progress) + $(count_runs queued) ))
            if [ "${pending}" -gt 0 ]; then
              if [ "${SECONDS}" -ge "${deadline}" ]; then
                echo "::error::E2E Kind is still running for ${SHA} after ${DEADLINE_MINUTES}m. Re-run this workflow once it finishes." >&2
                exit 1
              fi
              echo "E2E Kind in flight for ${SHA}; waiting..."
              sleep 30
              continue
            fi

            if [ "$(count_runs failure)" -gt 0 ]; then
              echo "::error::E2E Kind failed for ${SHA} and no later run succeeded. Fix it, or re-run E2E Kind on this commit if it was a flake." >&2
              exit 1
            fi

            echo "::error::No E2E Kind run found for ${SHA}. E2E Kind runs on pushes to main; a tag on a commit that never reached main must be validated first — run the E2E Kind workflow manually on this ref, then re-run this job." >&2
            exit 1
          done
