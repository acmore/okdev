name: Sidecar Image

# Release tags do not appear here as a push trigger on purpose: `paths` applies
# to tag pushes too, so a release whose commits happened to miss these paths
# would silently ship no image. The release workflow calls this one instead,
# after it has proven E2E Kind passed for the tagged commit.
on:
  workflow_dispatch:
    inputs:
      syncthing_version:
        description: Syncthing version (e.g. v1.29.7)
        required: false
        default: v1.29.7
  workflow_call:
    inputs:
      syncthing_version:
        description: Syncthing version (e.g. v1.29.7)
        required: false
        default: v1.29.7
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/syncthing-image.yml"
      - "infra/sidecar/**"
      - "cmd/okdev-sshd/**"
      - "internal/syncthing/**"
      - "internal/ssh/**"
      - "internal/cli/syncthing.go"
      - "internal/cli/ssh.go"
      - "internal/cli/up.go"
      - "internal/workload/**"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set variables
        id: vars
        shell: bash
        env:
          # workflow_call passes inputs.syncthing_version; workflow_dispatch
          # puts it on event.inputs. Neither is set for a push.
          REQUESTED_VERSION: ${{ inputs.syncthing_version }}
        run: |
          syncthing_version="${REQUESTED_VERSION:-v1.29.7}"
          echo "syncthing_version=${syncthing_version}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On a workflow_call from the release, github.ref is the caller's ref —
      # the tag — so ref_name is the version being released.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/okdev
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,prefix=edge-
            type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/sidecar/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            SYNCTHING_VERSION=${{ steps.vars.outputs.syncthing_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
