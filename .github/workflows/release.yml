name: Release

# Triggered by the tag itself rather than by the E2E Kind run that used to
# follow it. Nothing publishes until successful CI and E2E Kind runs exist for
# this exact commit, but a tag on a commit main already validated no longer
# re-runs the suites to learn what they know.
on:
  push:
    tags:
      - "v*"

jobs:
  # A called workflow cannot ask for more than its caller was given, and a
  # caller that grants nothing gives it nothing — the whole run is rejected
  # before any job starts. The verify jobs read other runs, so grant that here.
  verify-ci:
    uses: ./.github/workflows/verify-checks.yml
    permissions:
      actions: read
      contents: read
    with:
      sha: ${{ github.sha }}
      workflow: ci.yml
      timeout_minutes: 20

  verify-e2e:
    uses: ./.github/workflows/verify-checks.yml
    permissions:
      actions: read
      contents: read
    with:
      sha: ${{ github.sha }}
      workflow: e2e-kind.yml

  build:
    needs: [verify-ci, verify-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build archive
        run: |
          mkdir -p dist
          VERSION="${{ github.ref_name }}"
          COMMIT="${{ github.sha }}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BIN="okdev_${{ matrix.goos }}_${{ matrix.goarch }}"
          OUT_DIR="dist/${BIN}"
          mkdir -p "${OUT_DIR}"
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build \
            -trimpath \
            -ldflags="-s -w -X github.com/acmore/okdev/internal/version.Version=${VERSION} -X github.com/acmore/okdev/internal/version.Commit=${COMMIT} -X github.com/acmore/okdev/internal/version.Date=${BUILD_DATE}" \
            -o "${OUT_DIR}/okdev" \
            ./cmd/okdev
          tar -C "${OUT_DIR}" -czf "dist/${BIN}.tar.gz" okdev
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: okdev-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/okdev_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz

  # The sidecar image is part of the release, so it is published from here
  # rather than from its own tag trigger — see syncthing-image.yml for why a
  # push trigger cannot express "tags, regardless of which paths changed".
  sidecar-image:
    needs: [verify-ci, verify-e2e]
    uses: ./.github/workflows/syncthing-image.yml
    permissions:
      contents: read
      packages: write

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      # Keyless Sigstore signing of the build provenance: `okdev upgrade`
      # refuses an archive unless it carries an attestation signed by this
      # workflow for this tag.
      id-token: write
      attestations: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: okdev-*
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          sha256sum okdev_*.tar.gz > checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/okdev_*.tar.gz

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/okdev_*.tar.gz
            dist/checksums.txt
